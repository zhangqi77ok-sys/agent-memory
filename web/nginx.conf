server {
  listen 80;
  server_name _;
  # 静态资源挂在 /memory/ui/；/memory/ 业务 API 由外层 Nginx 反代到 api 容器
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = /memory/ui {
    return 301 /memory/ui/;
  }

  location /memory/ui/ {
    try_files $uri $uri/ /memory/ui/index.html;
  }

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
