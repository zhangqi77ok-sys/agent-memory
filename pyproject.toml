[project]
name = "agent-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1", "pgvector>=0.2.5", "pyjwt>=2.8", "pydantic-settings>=2.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() 惯用法
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 必须先设置 DATABASE_URL 再导入 app
